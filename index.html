<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>게임 모음</title>
<style>
  :root{--bg:#F2F6EC;--ink:#22301F;--accent:#58B030;--deep:#3E871C}
  @media (prefers-color-scheme: dark){:root{--bg:#111711;--ink:#E5EEDF;--accent:#68C23E;--deep:#427F24}}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 ui-rounded,system-ui,sans-serif;padding:32px 16px}
  h1{font-size:24px;margin:0 0 16px}
  nav{display:flex;flex-wrap:wrap;gap:12px}
  a{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-weight:800;padding:14px 20px;border-radius:16px;box-shadow:0 4px 0 var(--deep)}
</style>
</head>
<body>
<h1>게임 모음</h1>
<nav>
<a href="체스/">솔솔대국(체스)</a>
<a href="장기/">솔솔대국(장기)</a>
</nav>
</body>
</html>
